[project]
name = "nomad-sec-ops"
version = "0.1.0"
description = "Security analysis CLI for repositories in the Nomad ecosystem."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.29.1",
    "zizmor>=1.32.0",
]

[project.scripts]
nomadsecops = "nomad_sec_ops.cli:app"

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "ty>=0.0.101",
]

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ty.src]
include = ["nomad_sec_ops", "tests"]

[tool.ty.terminal]
error-on-warning = true
