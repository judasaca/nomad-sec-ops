name: Nomad SecOps

on:
  workflow_call:

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.1"
      - name: Audit GitHub Actions workflows
        run: >-
          uvx --no-config --no-cache --python 3.14
          --from 'nomad-sec-ops @ git+https://github.com/judasaca/nomad-sec-ops.git@develop'
          nomadsecops static-analysis --path .
